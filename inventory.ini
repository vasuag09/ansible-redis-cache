# Target: the Ubuntu VM itself. Ansible runs locally on the same machine
# it is configuring (ansible_connection=local -> no SSH involved).
#
# If you later move to a real remote-management setup, replace this with:
#   [redis_servers]
#   redis1 ansible_host=<VM_IP> ansible_user=<ssh_user> ansible_ssh_private_key_file=<path_to_key>

[redis_servers]
localhost ansible_connection=local
