# Test harness inventory: targets a local systemd-enabled Ubuntu 24.04
# Docker container instead of a real VM, so the playbook can be verified
# end-to-end (package install, templating, service start, auth check)
# without needing cloud credentials. See tests/README.md for how this
# container is built and for the container's Docker-imposed limitations
# (ufw/network isolation is NOT meaningfully testable in a container).
#
# Build/run the container first:
#   docker build -f tests/Dockerfile.systemd-ubuntu -t redis-verify-image tests/
#   docker run -d --name redis-verify-vm --privileged --cgroupns=host \
#     --tmpfs /tmp --tmpfs /run --tmpfs /run/lock \
#     -v /sys/fs/cgroup:/sys/fs/cgroup:rw redis-verify-image
#
# Run against it:
#   ansible-playbook -i tests/inventory.docker.ini playbook.yml \
#     --ask-vault-pass -e ansible_become=false -e redis_configure_firewall=false

[redis_servers]
redis-verify-vm ansible_connection=community.docker.docker
